name: build

# De Coolify-deploy bouwt met `npm run build` (Nixpacks). Tot nu toe draaide die
# validatie alleen tijdens de deploy, waardoor een kapot activiteitenbestand pas
# op productie zichtbaar werd (issue #6). Deze workflow draait exact dezelfde
# stap al op de PR, zodat dezelfde fout niet meer main kan bereiken.
#
# Sinds de coverage-tooling draait deze workflow ook `npm run coverage`: de
# line total wordt geprint, de drempel uit .c8rc.json wordt afgedwongen en
# coverage/lcov.info wordt als actueel bewijs meegecommit (niet alleen een
# logregel — die is niet duurzaam).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-activities:
    name: validate activities + generated registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # c8 (de coverage-runner) zit in devDependencies, dus deze stap is nodig.
      - name: Installeer dev-dependencies (c8)
        run: npm ci

      - name: Valideer activities/*.json (zelfde stap als de Coolify-build)
        run: npm test

      - name: activities.generated.js moet meegecommit zijn
        run: git diff --exit-code -- activities.generated.js

      - name: Coverage report (line total + drempel uit .c8rc.json)
        run: npm run coverage

      - name: coverage/lcov.info moet meegecommit zijn
        run: git diff --exit-code -- coverage/lcov.info
