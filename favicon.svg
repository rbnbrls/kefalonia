<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Sea Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D4A78" />
      <stop offset="100%" stop-color="#1B6CA8" />
    </linearGradient>
    
    <!-- Golden Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0D7" />
      <stop offset="100%" stop-color="#C9962A" />
    </linearGradient>

    <!-- Clip to keep elements inside the circle -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#seaGrad)" />

  <!-- Clipped Foreground Content -->
  <g clip-path="url(#circleClip)">
    <!-- Golden Sun -->
    <circle cx="340" cy="180" r="90" fill="url(#sunGrad)" />
    
    <!-- Sun Ray/Glow effect (subtle) -->
    <circle cx="340" cy="180" r="120" fill="url(#sunGrad)" opacity="0.1" />

    <!-- Back Wave (Sea Light) -->
    <path d="M -20 340 Q 140 250 280 340 T 540 300 L 540 520 L -20 520 Z" fill="#D4E8F5" opacity="0.85" />

    <!-- Front Wave (Sand/White) -->
    <path d="M -20 390 Q 120 310 260 400 T 540 350 L 540 520 L -20 520 Z" fill="#FDFAF5" />

    <!-- Stylized Sailboat (Terracotta/Gold highlights, matching the site's accent colors) -->
    <g transform="translate(160, 260)">
      <!-- Main Sail (White/Sand) -->
      <path d="M 40 -10 C 40 -10 10 -40 5 -60 C 25 -50 40 -30 40 -10 Z" fill="#F5EFE3" />
      <!-- Jib/Front Sail (Gold) -->
      <path d="M 45 -10 C 45 -10 65 -30 65 -45 C 55 -35 45 -20 45 -10 Z" fill="#C9962A" />
      <!-- Mast -->
      <line x1="42" y1="-8" x2="42" y2="-62" stroke="#1A1612" stroke-width="3" stroke-linecap="round" />
      <!-- Hull (Terracotta) -->
      <path d="M 10 0 L 70 0 C 65 15 50 15 50 15 L 25 15 C 20 15 12 8 10 0 Z" fill="#C4622D" />
    </g>
  </g>

  <!-- Outer ring for elegant finish -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#F5EFE3" stroke-width="6" opacity="0.4" />
</svg>
